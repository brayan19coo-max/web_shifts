<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Generar clave del drop</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: #0a0a0a; color: #f4f4f4; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(560px, 100%); display: grid; gap: 14px; }
    h1 { margin: 0; font-size: 28px; }
    p { margin: 0; color: #9a9a9a; }
    input, button, textarea { font: inherit; border-radius: 10px; border: 1px solid #333; background: #141414; color: inherit; padding: 12px 14px; }
    button { background: #f4f4f4; color: #0a0a0a; font-weight: 700; cursor: pointer; border: 0; }
    textarea { resize: none; font-family: ui-monospace, monospace; font-size: 13px; }
    code { background: #1f1f1f; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main>
    <h1>🔒 Generar clave del drop</h1>
    <p>1. Escribe la nueva clave. 2. Copia el código. 3. Pégalo en <code>js/config.js</code> → <code>DROP.passwordHash</code>.</p>
    <input id="key" type="text" placeholder="Nueva clave" autocomplete="off">
    <textarea id="out" rows="3" readonly placeholder="Aquí aparece el código"></textarea>
    <button id="copy" type="button">Copiar código</button>
    <p id="status"></p>
  </main>
  <script type="module">
    import { sha256 } from '../js/utils/sha256.js';
    const key = document.getElementById('key');
    const out = document.getElementById('out');
    const status = document.getElementById('status');
    key.addEventListener('input', () => {
      out.value = key.value.trim() ? sha256(key.value.trim()) : '';
      status.textContent = '';
    });
    document.getElementById('copy').addEventListener('click', async () => {
      if (!out.value) return;
      out.select();
      try {
        await navigator.clipboard.writeText(out.value);
        status.textContent = '✓ Copiado. Ahora pégalo en config.js';
      } catch {
        status.textContent = 'Selecciona el código y cópialo con Ctrl+C';
      }
    });
  </script>
</body>
</html>
